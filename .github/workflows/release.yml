name: Release

on:
  push:
    tags:
      - "v*"

# Needs write access to create the GitHub release.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history for git-cliff

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Pulls from the project cache; pushes what this job built on main only
      # (PRs, forks and tags read but never write).
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: stc
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: ${{ github.ref != 'refs/heads/main' }}

      # Release notes = the current tag's section, rendered by git-cliff from the
      # dev shell so local `just changelog` and CI use the same tool version.
      - name: Generate release notes
        run: nix develop --command git-cliff --latest --strip header --output RELEASE_NOTES.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: RELEASE_NOTES.md
